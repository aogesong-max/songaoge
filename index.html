<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d14">
  <meta name="color-scheme" content="dark">
  <meta name="author" content="SONGAOGE">
  <meta name="description" content="SONGAOGE 作品集">
  <title>SONGAOGE — Selected Works</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0d14'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,sans-serif' font-size='23' font-weight='900' fill='%23e8e6ec'%3ESG%3C/text%3E%3C/svg%3E">
  <style>html,body{margin:0;min-height:100%;background:#0c0d14;color:#e8e6ec}</style>
  <link rel="stylesheet" href="./css/style.css">
  <script>
    document.documentElement.classList.add("js");
    window.__bootDismiss = function (recordSession) {
      window.clearTimeout(window.__bootSafetyTimer);
      document.documentElement.classList.remove("boot-active");
      document.documentElement.classList.add("boot-forced");
      document.body.classList.remove("boot-locked");
      var bootLayer = document.getElementById("boot-layer");
      if (bootLayer) bootLayer.setAttribute("aria-hidden", "true");
      if (recordSession) {
        try {
          window.sessionStorage.setItem("songaoge-boot-played-v5", "1");
        } catch (error) {}
      }
    };
    window.__bootSafetyTimer = window.setTimeout(function () {
      window.__bootDismiss(false);
    }, 8500);
    try {
      if (window.sessionStorage.getItem("songaoge-boot-played-v5") === "1") {
        document.documentElement.classList.add("boot-session-seen");
      }
    } catch (error) {}
  </script>
  <noscript>
    <style>
      .boot-layer{display:none!important}
      .js-only{display:none!important}
      .noscript-grid{display:grid!important}
    </style>
  </noscript>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <div class="boot-layer" id="boot-layer" role="dialog" aria-label="SONGAOGE 启动动画" aria-hidden="false">
    <video class="boot-video" id="boot-video" src="./assets/intro/startup.mp4" poster="./assets/intro/poster.jpg" muted playsinline preload="auto" aria-hidden="true"></video>
    <button class="boot-skip" id="boot-skip" type="button" onclick="window.__bootDismiss &amp;&amp; window.__bootDismiss(true)">跳过 SKIP <span aria-hidden="true">→</span></button>
  </div>

  <header class="site-header">
    <a class="wordmark" href="#home" aria-label="SONGAOGE 首页">SONGAOGE</a>
    <span class="avatar avatar--small" aria-hidden="true"></span>
  </header>

  <main id="main-content">
    <section class="hero" id="home">
      <div class="hero-video-bg" aria-hidden="true">
        <video id="hero-background-video" muted loop playsinline preload="metadata" poster="./assets/hero/hero-background-poster.jpg">
          <source src="./assets/hero/hero-background.mp4" type="video/mp4">
        </video>
      </div>
      <div class="hero__word" aria-label="SONGAOGE">SONGAOGE</div>
      <div class="hero__portrait">
        <span class="avatar avatar--hero"></span>
      </div>
    </section>

    <section class="marquee" aria-label="作品类别">
      <div class="marquee__track">
        <span>AI SHORT DRAMA</span><i>✦</i>
        <span class="is-outline">IP DESIGN</span><i>✦</i>
        <span>CREATIVE IMAGE</span><i>✦</i>
        <span class="is-outline">E-COMMERCE</span><i>✦</i>
        <span>GAME CG</span><i>✦</i>
        <span class="is-outline">GIRL GROUP MV</span><i>✦</i>
        <span aria-hidden="true">AI SHORT DRAMA</span><i aria-hidden="true">✦</i>
        <span class="is-outline" aria-hidden="true">IP DESIGN</span><i aria-hidden="true">✦</i>
        <span aria-hidden="true">CREATIVE IMAGE</span><i aria-hidden="true">✦</i>
        <span class="is-outline" aria-hidden="true">E-COMMERCE</span><i aria-hidden="true">✦</i>
        <span aria-hidden="true">GAME CG</span><i aria-hidden="true">✦</i>
        <span class="is-outline" aria-hidden="true">GIRL GROUP MV</span><i aria-hidden="true">✦</i>
      </div>
    </section>

    <nav class="category-nav" id="category-nav" aria-label="作品分类">
      <a href="#drama" class="is-active" data-section="drama"><span>01</span>AI短剧</a>
      <a href="#design" data-section="design"><span>02</span>AI设计图</a>
    </nav>

    <section class="noscript-grid" aria-label="作品封面">
      <a href="#drama"><img src="./assets/works/drama/boxer/cover.jpg" alt="这个拳手不太冷"></a>
      <a href="#drama"><img src="./assets/works/drama/sixth-second/cover.jpg" alt="第六秒"></a>
      <a href="#drama"><img src="./assets/works/drama/ai-sisters/cover.jpg" alt="全世界只有我有AI"></a>
      <a href="#drama"><img src="./assets/works/drama/dongbei-seoul/cover.jpg" alt="东北留子的首尔生活"></a>
    </section>

    <section class="works-section" id="drama" aria-labelledby="drama-title">
      <div class="section-heading">
        <span class="section-heading__index">01</span>
        <h2 id="drama-title">AI短剧</h2>
        <span class="section-heading__en">AI <em>Short Drama</em></span>
      </div>
      <div class="drama-list" id="drama-list"></div>
    </section>

    <section class="works-section design-section" id="design" aria-labelledby="design-title">
      <div class="section-heading">
        <span class="section-heading__index">02</span>
        <h2 id="design-title">AI设计图</h2>
        <span class="section-heading__en">Visual <em>Archive</em></span>
      </div>
      <div class="design-groups" id="design-groups"></div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-word" aria-hidden="true">SONGAOGE</div>
  </footer>

  <div class="detail-layer" id="detail-layer" aria-hidden="true">
    <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="detail-topbar">
        <button class="detail-back" id="detail-back" type="button"><span aria-hidden="true">←</span> 返回</button>
        <nav class="detail-breadcrumb" id="detail-breadcrumb" aria-label="面包屑"></nav>
        <button class="detail-close" id="detail-close" type="button" aria-label="关闭">×</button>
      </div>
      <nav class="detail-toc" id="detail-toc" aria-label="详情分段"></nav>
      <div class="detail-content" id="detail-content"></div>
      <div class="detail-pagination" id="detail-pagination"></div>
    </div>
  </div>

  <div class="image-lightbox" id="image-lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭大图">×</button>
    <img id="lightbox-image" alt="">
  </div>

  <script src="./data/works.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>
